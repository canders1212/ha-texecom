name: "💡 Idea"
description: Something you'd like it to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you'd use it for helps as much as the idea itself.
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Your panel and connection
      placeholder: e.g. Premier Elite 48 with a ComIP
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (if it's about something your panel has)
      description: |
        On the panel's device page, choose **⋮ → Download diagnostics** and drag the file here. Codes and the panel's address are removed automatically. For a detector or module Home Assistant doesn't show yet, the [📡 Share my panel's data](https://github.com/metaljay/ha-texecom/issues/new?template=3-data.yml) form asks for everything that helps.
